name: Deploy to Cloudflare

# Runs on every push to the game branch, and can be started by hand from the
# GitHub Actions tab (which works fine in a phone browser).
on:
  push:
    branches:
      - main
      - claude/multiplayer-fps-game-nxohcu
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build client
        run: pnpm --filter @webgame/client build

      # Preferred path: deploy into the repo owner's own Cloudflare account.
      - name: Deploy to your Cloudflare account
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server

      # No secrets configured yet: put the game somewhere playable anyway.
      # Wrangler provisions a throwaway preview account and prints both the
      # live workers.dev URL and a claim link for adopting it later.
      - name: Deploy to a temporary preview account
        if: env.CF_TOKEN == ''
        working-directory: apps/server
        run: |
          set -o pipefail
          npx wrangler deploy --temporary 2>&1 | tee deploy.log
          echo "### Temporary deployment" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^ ]+' deploy.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain how to make it permanent
        if: env.CF_TOKEN == ''
        run: |
          echo "Deployed to a temporary Cloudflare preview account, which expires."
          echo "To deploy into your own account instead, add two repository secrets:"
          echo "  CLOUDFLARE_API_TOKEN   (dash.cloudflare.com -> API Tokens -> Edit Cloudflare Workers)"
          echo "  CLOUDFLARE_ACCOUNT_ID  (shown on the Workers page)"
          echo "This workflow switches to your account automatically once they exist."
